<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - PhishGuard</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div id="pg-header"></div>

  <main class="pg-main auth-page">
    <div class="container">
      <div class="auth-card card">
        <div class="card-body">
          <div class="auth-header">
            <svg class="icon icon-xl" aria-hidden="true"><use href="/img/icons.svg#icon-shield"></use></svg>
            <h2>Create Account</h2>
            <p>Sign up to save your scan history</p>
          </div>

          <div data-error="general" class="form-error mb-4"></div>

          <form id="register-form" novalidate>
            <div class="form-group">
              <label for="register-email" class="form-label">Email Address</label>
              <input type="email" id="register-email" name="email" class="form-input" placeholder="you@example.com" autocomplete="email" required>
              <div data-error="email" class="form-error"></div>
            </div>

            <div class="form-group">
              <label for="register-password" class="form-label">Password</label>
              <input type="password" id="register-password" name="password" class="form-input" placeholder="Minimum 8 characters" autocomplete="new-password" required>
              <div data-error="password" class="form-error"></div>
              <div class="form-hint">Must be at least 8 characters long.</div>
            </div>

            <div class="form-group">
              <label for="register-confirm" class="form-label">Confirm Password</label>
              <input type="password" id="register-confirm" name="confirm_password" class="form-input" placeholder="Re-enter your password" autocomplete="new-password" required>
              <div data-error="confirm_password" class="form-error"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-full">Create Account</button>
          </form>

          <div class="auth-footer mt-6">
            Already have an account? <a href="/login.html">Sign in</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="pg-footer"></div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
