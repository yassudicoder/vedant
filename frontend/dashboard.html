<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - PhishGuard</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div id="pg-header"></div>

  <main class="pg-main">
    <div class="container">

      <h2 class="mb-6">Admin Dashboard</h2>

      <!-- Stats Cards -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-card-icon total">
            <svg class="icon icon-lg" aria-hidden="true"><use href="/img/icons.svg#icon-bar-chart"></use></svg>
          </div>
          <div id="stat-total" class="stat-card-value">-</div>
          <div class="stat-card-label">Total Scans</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon phishing">
            <svg class="icon icon-lg" aria-hidden="true"><use href="/img/icons.svg#icon-alert-triangle"></use></svg>
          </div>
          <div id="stat-phishing" class="stat-card-value">-</div>
          <div class="stat-card-label">Phishing Detected</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon suspicious">
            <svg class="icon icon-lg" aria-hidden="true"><use href="/img/icons.svg#icon-eye"></use></svg>
          </div>
          <div id="stat-suspicious" class="stat-card-value">-</div>
          <div class="stat-card-label">Suspicious</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon legitimate">
            <svg class="icon icon-lg" aria-hidden="true"><use href="/img/icons.svg#icon-check-circle"></use></svg>
          </div>
          <div id="stat-legitimate" class="stat-card-value">-</div>
          <div class="stat-card-label">Legitimate</div>
        </div>
      </div>

      <!-- Charts -->
      <div class="charts-grid">
        <div class="card">
          <div class="card-header">
            <h4>Daily Scans (30 Days)</h4>
          </div>
          <div class="card-body">
            <div class="chart-container">
              <canvas id="chart-daily"></canvas>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-header">
            <h4>Risk Distribution</h4>
          </div>
          <div class="card-body">
            <div class="chart-container">
              <canvas id="chart-distribution"></canvas>
            </div>
          </div>
        </div>
      </div>

      <!-- Recent Scans -->
      <div class="admin-section">
        <div class="card">
          <div class="card-header">
            <h4>Recent Scans</h4>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>Scan ID</th>
                  <th>URL</th>
                  <th>Classification</th>
                  <th>Risk Score</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody id="recent-scans-tbody">
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- User Management -->
      <div class="admin-section">
        <div class="card">
          <div class="card-header">
            <h4>User Management</h4>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Joined</th>
                  <th>Scans</th>
                  <th>Last Login</th>
                </tr>
              </thead>
              <tbody id="users-tbody">
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>

  <div id="pg-footer"></div>

  <script src="/vendor/chart.umd.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
