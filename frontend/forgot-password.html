<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - PhishGuard</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div id="pg-header"></div>

  <main class="pg-main auth-page">
    <div class="container">
      <div class="auth-card card">
        <div class="card-body">
          <div class="auth-header">
            <svg class="icon icon-xl" aria-hidden="true"><use href="/img/icons.svg#icon-lock"></use></svg>
            <h2>Reset Password</h2>
            <p>Enter your email address and we'll send you instructions to reset your password.</p>
          </div>

          <!-- Success Message -->
          <div id="forgot-success" class="hidden">
            <div class="alert alert-success mb-4">
              <svg class="icon" aria-hidden="true"><use href="/img/icons.svg#icon-check-circle"></use></svg>
              <span>If an account with that email exists, you will receive password reset instructions.</span>
            </div>
            <div class="text-center">
              <a href="/login.html" class="btn btn-primary">Back to Login</a>
            </div>
          </div>

          <form id="forgot-form" novalidate>
            <div class="form-group">
              <label for="forgot-email" class="form-label">Email Address</label>
              <input type="email" id="forgot-email" name="email" class="form-input" placeholder="you@example.com" autocomplete="email" required>
              <div data-error="email" class="form-error"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-full">Send Reset Link</button>
          </form>

          <div class="auth-footer mt-6">
            Remember your password? <a href="/login.html">Sign in</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="pg-footer"></div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
