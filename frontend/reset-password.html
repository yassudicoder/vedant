<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - PhishGuard</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div id="pg-header"></div>

  <main class="pg-main auth-page">
    <div class="container">
      <div class="auth-card card">
        <div class="card-body">
          <div class="auth-header">
            <svg class="icon icon-xl" aria-hidden="true"><use href="/img/icons.svg#icon-lock"></use></svg>
            <h2>Set New Password</h2>
            <p>Choose a new password for your account.</p>
          </div>

          <!-- Token Error -->
          <div id="reset-error" class="hidden form-error mb-4"></div>

          <div data-error="general" class="form-error mb-4"></div>

          <form id="reset-form" novalidate>
            <div class="form-group">
              <label for="reset-password" class="form-label">New Password</label>
              <input type="password" id="reset-password" name="password" class="form-input" placeholder="Minimum 8 characters" autocomplete="new-password" required>
              <div data-error="password" class="form-error"></div>
              <div class="form-hint">Must be at least 8 characters long.</div>
            </div>

            <div class="form-group">
              <label for="reset-confirm" class="form-label">Confirm New Password</label>
              <input type="password" id="reset-confirm" name="confirm_password" class="form-input" placeholder="Re-enter your new password" autocomplete="new-password" required>
              <div data-error="confirm_password" class="form-error"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-full">Reset Password</button>
          </form>

          <div class="auth-footer mt-6">
            <a href="/login.html">Back to Login</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="pg-footer"></div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
